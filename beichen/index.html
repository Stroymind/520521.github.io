*,*::before,*::after {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;overflow-x:hidden;background:var(--bg);color:var(--white)}
a {color:inherit;text-decoration:none}button {font:inherit}

[hidden]{display:none!important}::selection{background:var(--mint);color:var(--bg)}
.skip{position:fixed;top:-120px;left:16px;z-index:100;background:#fff;color:#000;padding:12px}.skip:focus{top:14px}

.lang{color:var(--mint);background:none;border:1px solid rgba(183,249,213,.34);border-radius:50px;padding:0 15px;cursor:pointer}

.story-stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,220,205,.029) 1px,transparent 1px),linear-gradient(90deg,rgba(160,220,205,.029) 1px,transparent 1px);background-size:106px 106px;mask-image:radial-gradient(ellipse at 65% 55%,#000,transparent 85%);pointer-events:none}
.story-stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(8,11,16,.3) 100%)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;will-change:opacity,transform;transform:translate3d(0,0,0)}
.scene.is-visible{visibility:visible}

.scene-title-wrap,.scene-detail-wrap{grid-area:1/1;min-width:0;pointer-events:none}
.scene-detail-wrap{max-width:860px}
.title{margin:0;font-weight:660;letter-spacing:-.066em;line-height:1.22;font-size:clamp(56px,9vw,136px);word-break:keep-all;overflow-wrap:break-word}
.title-text{display:block}
.title-text .glyph,.detail .glyph{display:inline-block;white-space:pre;transform-origin:50% 76%;will-change:opacity,filter,transform}
.title-text .word,.detail .word{display:inline-block;white-space:nowrap}
.title-text .emphasis{color:var(--mint);display:inline-block;font-style:italic;transform:skewX(-9deg)}
.title-text .emphasis .glyph{font-style:italic}
.title-copy{position:relative}
.detail{color:#d7e4df;font-size:clamp(24px,3.6vw,52px);line-height:1.55;letter-spacing:-.04em;font-weight:420;margin:0;max-width:880px;word-break:keep-all;overflow-wrap:break-word}

.scene-actions a:hover{border-color:#fff;color:white}
.scene.is-actionable .scene-actions{visibility:visible;pointer-events:auto;opacity:1;transform:none;transition:opacity .6s ease,transform .6s ease}
.scene.is-actionable{pointer-events:auto}
.scene-ambient{position:absolute;inset:0;opacity:.6;pointer-events:none;will-change:transform}

.ribbon--inner{width:min(31vw,390px);top:34%;right:-11%;border-color:rgba(183,249,213,.08);transform:rotate(35deg) scaleY(.4)}
/* Each chapter has a distinct typographic composition. */
.scene--hero .scene-inner{justify-items:start}.scene--hero .title{font-size:clamp(80px,12vw,174px)}
.scene--offset .scene-inner{text-align:right;justify-items:end}.scene--offset .detail{margin-left:auto}.scene--offset .ribbon{right:auto;left:-20%}
.scene--contrast .scene-inner{justify-items:center;text-align:center}.scene--contrast .detail{max-width:810px}.scene--contrast .title{font-weight:750}
.scene--contrast .ribbon{right:30%;top:10%;transform:scale(.65) rotate(33deg)}
.scene--work .scene-inner{justify-items:start}.scene--work .title{font-size:clamp(52px,8.1vw,126px)}
.scene--work .detail{font-size:clamp(23px,3.2vw,44px)}
.scene--goal .scene-inner{justify-items:end;text-align:right}.scene--goal .detail{margin-left:auto}
.scene--goal .title{font-size:clamp(52px,8.7vw,132px)}
.scene--finale .scene-inner{justify-items:center;text-align:center}.scene--finale .title{font-size:clamp(53px,8.6vw,135px)}
.scene--finale .detail{max-width:920px}
.scene--finale .ribbon{right:15%;top:13%;transform:scale(.75) rotate(18deg)}
/* Headline alone first. Then it dissolves and the sentence is revealed character by character. */
.js .scene .scene-title-wrap,.js .scene .scene-detail-wrap{opacity:0}
.js .scene.is-playing .scene-title-wrap{opacity:1;animation:titleOut .62s ease var(--title-leave) both}
.js .scene.is-playing .scene-title-wrap .glyph{animation:charIn .72s cubic-bezier(.2,.76,.18,1) var(--delay) both}
.js .scene.is-playing .scene-detail-wrap{opacity:1}
.js .scene.is-playing .scene-detail-wrap .glyph{animation:charIn .7s cubic-bezier(.2,.76,.2,1) var(--delay) both}
.js .scene.is-playing .scene-detail-wrap .detail{visibility:visible}
@keyframes charIn{from{opacity:0;filter:blur(11px);transform:translate3d(var(--dx,0px),var(--dy,33px),0) rotate(var(--rot,0deg)) scale(.9)}to{opacity:1;filter:blur(0);transform:translate3d(0,0,0) rotate(0deg) scale(1) skewX(var(--slant,0deg))}}
@keyframes titleOut{0%,7%{opacity:1;filter:blur(0);transform:translate3d(0,0,0)}100%{opacity:0;filter:blur(13px);transform:translate3d(0,-27px,0)}}
/* Keep the final contact area in native page flow, and make it part of the same transition. */
.contact{position:relative;min-height:93svh;display:flex;align-items:center;justify-content:center;padding:120px clamp(26px,9vw,135px) 90px;background:radial-gradient(ellipse at 50% 3%,rgba(20,101,81,.12),transparent 65%),var(--bg)}

.contact-links a:hover,.contact-links button:hover{border-color:#fff;color:#fff}
.feedback{min-height:1.6em;font-size:14px;color:#a7c6b9;margin-top:24px}
/* Escape hatch: an accessible full-content view for reduced motion and script failure. */
@media(max-width:700px){

 .story-stage{min-height:530px}
 .scene-inner{width:calc(100% - 52px);min-height:50svh}
 .title{font-size:clamp(54px,11.8vw,81px);line-height:1.26;letter-spacing:-.068em}
 .scene--hero .title{font-size:clamp(76px,17vw,115px)}
 .scene--work .title,.scene--goal .title,.scene--finale .title{font-size:clamp(51px,11.5vw,81px)}
 .detail,.scene--work .detail{font-size:clamp(23px,6vw,34px);line-height:1.57;letter-spacing:-.04em}
 .scene--offset .scene-inner,.scene--goal .scene-inner{justify-items:start;text-align:left}
 .scene--offset .detail,.scene--goal .detail{margin-left:0}
 .scene--contrast .scene-inner{text-align:left;justify-items:start}
 .scene--contrast .title{font-size:clamp(53px,11.8vw,81px)}
 .scene--finale .scene-inner{text-align:left;justify-items:start}
 .scene-actions{margin-top:32px;gap:12px 25px}
 .ribbon{width:112vw;right:-57%;top:32%}.ribbon--inner{width:75vw;right:-39%;top:36%}
 .contact{padding:100px 27px 65px;min-height:75svh}.contact h2{margin-bottom:48px}.contact-links{gap:12px 28px}
}
@media(max-width:350px){.title{font-size:48px!important}.scene--hero .title{font-size:72px!important}.detail{font-size:22px!important}.nav-inner{gap:11px}}
@media(prefers-reduced-motion:reduce){

 .scene{position:relative;display:block;min-height:78svh;visibility:visible!important;opacity:1!important;transform:none!important;padding:110px 0 80px;pointer-events:auto!important}
 .scene-inner{display:block;min-height:0}.scene-title-wrap,.scene-detail-wrap{opacity:1!important;animation:none!important}

 .contact-inner{opacity:1;transform:none}.scene-ambient{display:none}
}
/* Default non-JS fallback: show all content as ordinary document. */
html:not(.js) .story{height:auto;min-height:0}html:not(.js) .story-stage{position:relative;height:auto;min-height:0}
html:not(.js) .scene{position:relative;opacity:1;visibility:visible;min-height:72svh;display:flex;pointer-events:auto}
html:not(.js) .scene-inner{display:block}html:not(.js) .scene-detail-wrap{margin-top:26px}
html:not(.js) .scene-actions{opacity:1;visibility:visible;transform:none;pointer-events:auto}
html:not(.js) .contact-inner{opacity:1;transform:none}

 lang=code==='en'?'en':'zh';let trans=textMap[lang];document.documentElement.lang=lang==='en'?'en':'zh-CN';
 document.title=lang==='en'?'Beichen | Ideas into things':'北辰｜从想法，到作品';
 document.querySelectorAll('[data-i]').forEach(node=>{let key=node.dataset.i;if(trans[key]===undefined)return;if(key==='contactTitle')node.innerHTML=trans[key];else node.textContent=trans[key]});
 scenes.forEach((scene,i)=>{let k=scene.dataset.key;let values=trans[k];buildLetters(scene.querySelector('[data-text="title"]'),values.title,k,'title',i);buildLetters(scene.querySelector('[data-text="detail"]'),values.detail,k,'detail',i);scene.classList.remove('is-playing','is-actionable');scene.dataset.started='0';scene.setAttribute('aria-label',values.title);scene.style.setProperty('--title-leave','2110ms');});
 document.querySelector('#lang').textContent=lang==='en'?'中文':'EN';document.querySelector('#lang').setAttribute('aria-label',lang==='en'?'切换为中文':'Switch to English');
 document.querySelector('#feedback').textContent='';current=-1;update(true);
}
function playScene(i){
 const scene=scenes[i];if(!scene||scene.dataset.started==='1'||reduced.matches)return;
 scene.dataset.started='1';scene.classList.add('is-playing');
 // The complete sequence starts once on entrance; no additional scroll or tapping is required.
 const runId=Symbol();scene._run=runId;
 setTimeout(()=>{if(scene._run===runId&&scene.classList.contains('is-playing'))scene.classList.add('is-actionable')},3550);
}
function update(force=false){
 tick=0;const height=innerHeight;
 const range=Math.max(1,story.offsetHeight-height);
 const s=clamp((scrollY-story.offsetTop)/range,0,1)*(scenes.length-1);
 document.documentElement.style.setProperty('--progress',(scrollY/Math.max(1,document.documentElement.scrollHeight-height)).toFixed(5));
 if(reduced.matches){scenes.forEach(c=>{c.style.opacity='1';c.style.visibility='visible';c.style.transform='none';c.classList.add('is-actionable')});contact.classList.add('is-visible');return;}
 let nearest=Math.round(s);nearest=clamp(nearest,0,scenes.length-1);
 const visibleStory=(scrollY<story.offsetTop+story.offsetHeight&&scrollY+height>story.offsetTop);
 scenes.forEach((scene,i)=>{
   const delta=i-s,dist=Math.abs(delta);
   const op=visibleStory?1-smooth(.18,.91,dist):0;
   const visible=op>.008;
   scene.classList.toggle('is-visible',visible);
   scene.style.opacity=op.toFixed(3);
   scene.style.transform=`translate3d(${(-delta*15).toFixed(1)}px,${(delta*58).toFixed(1)}px,0) scale(${(1-Math.min(dist,1)*.055).toFixed(3)})`;
   scene.style.filter=`blur(${(Math.min(dist,1)*2.5).toFixed(2)}px)`;
   scene.style.zIndex=String(10-Math.round(dist*5));
   if(!visible&&scene.dataset.started==='1'&&dist>1.15){scene.dataset.started='0';scene.classList.remove('is-playing','is-actionable');scene._run=null;}
   scene.style.pointerEvents=dist<.4&&scene.classList.contains('is-actionable')?'auto':'none';
 });
 const active=scenes[nearest];if(visibleStory&&Math.abs(nearest-s)<.55&&active){if(current!==nearest||force){current=nearest;playScene(nearest)}else playScene(nearest)}
 const c=contact.getBoundingClientRect();contact.classList.toggle('is-visible',c.top<height*.88&&c.bottom>0);
}
function schedule(){if(!tick)tick=requestAnimationFrame(update)}
async function copy(kind){
 const val=kind==='douyin'?'Unko52520':'3203070078';const el=document.querySelector('#feedback');
 try{if(!navigator.clipboard?.writeText)throw new Error('clipboard missing');await navigator.clipboard.writeText(val);el.textContent=textMap[lang][kind+'Copied']}catch{el.textContent=textMap[lang][kind+'Fallback']}
}
document.querySelector('#lang').addEventListener('click',()=>{renderLanguage(lang==='en'?'zh':'en');try{localStorage.setItem('beichen-language',lang)}catch{}});
document.querySelector('#copy-douyin').addEventListener('click',()=>copy('douyin'));
document.querySelector('#copy-qq').addEventListener('click',()=>copy('qq'));
// The work jump targets the fourth narrative beat, not a separate page.
document.querySelector('.nav a[href="#work"]').addEventListener('click',event=>{event.preventDefault();const y=story.offsetTop+(story.offsetHeight-innerHeight)*3/(scenes.length-1);scrollTo({top:y,behavior:reduced.matches?'instant':'smooth'});try{history.replaceState(null,'','#work')}catch{}});
addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule,{passive:true});reduced.addEventListener?.('change',()=>{renderLanguage(lang);schedule()});
let initial=/^zh/i.test(navigator.language||'')?'zh':'en';try{let v=localStorage.getItem('beichen-language');if(v==='zh'||v==='en')initial=v}catch{}
renderLanguage(initial);if(location.hash==='#work')requestAnimationFrame(()=>scrollTo({top:story.offsetTop+(story.offsetHeight-innerHeight)*3/(scenes.length-1),behavior:'instant'}));requestAnimationFrame(update);
})();
</script>
